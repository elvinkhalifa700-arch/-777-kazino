services:
  - type: web
    name: 777-fruit-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false